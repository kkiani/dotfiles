[mgr]
sort_by = "btime"
sort_reverse = true
linemode = "btime"
sort_dir_first = false
show_symlink = true

[opener]
edit = [
    { run = 'nvim %s', block = true, desc = "Edit in Neovim" },
]
open = [
    { run = 'open %s', desc = "Open with default application" }
]
reveal = [
    { run = 'open -R %s1', desc = "Reveal in Finder" }
]
run_bash = [
    { run = 'bash %s1', block = true, desc = "Run in Bash Shell" }
]
run_fish = [
    { run = 'fish %s1', block = true, desc = "Run in Fish Shell" }
]
default = [
    { run = 'open %s', desc = "Open with default application" },
    { run = 'ouch compress %s %s1.zip', block = true, desc = "Compress File/s"},
    { run = 'open -R %s1', desc = "Reveal in Finder" }
]

[open]
rules = [
    { url = "*.fish", use = ["run_fish", "edit", "default"]},

    { url = "*.json", use = ["edit", "default"]},
    { url = "*.yaml", use = ["edit", "default"]},
    { url = "*.yml", use = ["edit", "default"]},
    { url = "*.toml", use = ["edit", "default"]},

    { mime = "text/*", use = ["edit", "default"]},

    # Fallback (must be last, first match wins)
    { url = "*", use = "default" },
    { url = "*/", use = "default" },
]

[plugin]
prepend_preloaders = [ ]
prepend_previewers = [
    { url = "*.key", run = "noop" },
    { url = "*.pages", run = "noop" },
    { url = "*.numbers", run = "noop" },
]
