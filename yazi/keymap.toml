[mgr]
prepend_keymap = [
    # palette keybindings
    { on = ["<Space>", "<Space>"], run = 'shell "qlmanage -p %s" --confirm', desc = "Quick look"},
    { on = ["<Space>", "d"], run = '''
        shell 'open -a Dropover %s' --confirm
    ''', desc = 'Drag and Drop' },

    # quick jump
    { on = ["g", "c"], run = 'cd ~/.dotfiles', desc = 'Go to dotfiles' },
    { on = ["g", "d"], run = 'cd ~/downloads', desc = 'Go to downloads' },
    { on = ["g", "h"], run = 'cd ~', desc = 'Go to home directory' },
    { on = ["g", "D"], run = 'cd ~/desktop', desc = 'Go to desktop' },

    # shell commands
    { on = ":", run = 'shell --block --interactive'},

    # quick actions
    { on = "e", run = 'shell "nvim %s" --block --confirm'},
    { on = "Y", run = '''
        shell 'osascript -e "on run args" -e "set the clipboard to POSIX file (item 1 of args)" -e "end run" %h' --confirm
    ''', desc = 'Copy file to clipboard' },
]
